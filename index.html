<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Толеген Бауыржан</title>
<meta name="description" content="Толеген Бауыржан — специалист в сфере управления, коммуникаций и стратегического развития. 9 лет опыта: руководство компанией и филиалом, работа с госорганами и международными организациями, аналитика.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Толеген Бауыржан — управление, коммуникации, стратегическое развитие">
<meta property="og:description" content="Управленец и аналитик с 9-летним опытом. Магистр международных отношений (КИМЭП). KZ · RU · EN.">
<meta property="og:locale" content="ru_RU">
<meta property="og:locale:alternate" content="kk_KZ">
<meta property="og:locale:alternate" content="en_US">
<meta name="theme-color" content="#0A6B66">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A6B66'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-weight='700' fill='%23fff' text-anchor='middle'%3ETB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,500;1,7..72,600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: an analyst's briefing file. Cool paper ground, ink type, one Caspian-teal accent.
   Hero = name set large like a dossier cover; career shown to scale on a 2015–2026 axis; contact closes on an ink band. */
:root{
  --paper:#F3F5F4; --surface:#FFFFFF; --ink:#111A1E; --muted:#56646A; --line:#D7DEDC;
  --accent:#0A6B66; --accent-ink:#FFFFFF; --accent-soft:#E0EEEB;
  --band:#10191D; --band-fg:#E9EFEE; --band-muted:#9AABAF; --band-line:#2A383D; --band-accent:#5CC2B5;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px; --s9:112px;
  --r:10px; --r-sm:6px;
  --wrap:1160px;
  --gutter:clamp(16px,4vw,40px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0C1215; --surface:#131C20; --ink:#E6ECEB; --muted:#93A2A6; --line:#253237;
  --accent:#5CC2B5; --accent-ink:#06201E; --accent-soft:#14302D;
  --band:#18242A; --band-fg:#E9EFEE; --band-muted:#9AABAF; --band-line:#2E3E44; --band-accent:#6FD3C6;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0C1215; --surface:#131C20; --ink:#E6ECEB; --muted:#93A2A6; --line:#253237;
  --accent:#5CC2B5; --accent-ink:#06201E; --accent-soft:#14302D;
  --band:#18242A; --band-fg:#E9EFEE; --band-muted:#9AABAF; --band-line:#2E3E44; --band-accent:#6FD3C6;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:84px}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16.5px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display); font-weight:600; line-height:1.12; text-wrap:balance; margin:0}
p{margin:0}
ul{margin:0; padding:0; list-style:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}
.wrap{max-width:var(--wrap); margin-inline:auto; padding-inline:var(--gutter)}
.mono{font-family:var(--f-mono); font-size:.78rem; letter-spacing:.04em}
.eyebrow{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
.skip{position:absolute; left:-999px; top:8px; background:var(--accent); color:var(--accent-ink); padding:8px 14px; border-radius:var(--r-sm); z-index:100}
.skip:focus{left:12px}

/* ---------- Header ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid transparent; transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex; align-items:center; gap:var(--s5); height:64px}
.mark{display:flex; align-items:center; gap:10px; text-decoration:none; font-family:var(--f-display); font-weight:600; font-size:1.02rem; white-space:nowrap}
.mark b{display:grid; place-items:center; width:34px; height:34px; border-radius:8px; background:var(--accent); color:var(--accent-ink); font-size:.85rem; letter-spacing:.02em}
.nav{display:flex; gap:2px; margin-left:auto}
.nav a{text-decoration:none; font-size:.9rem; color:var(--muted); padding:8px 11px; border-radius:var(--r-sm); transition:color .15s, background .15s}
.nav a:hover{color:var(--ink); background:var(--accent-soft)}
.nav a[aria-current="true"]{color:var(--ink); background:var(--accent-soft)}
.langs{display:flex; border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; flex:none}
.langs button{font:500 .74rem/1 var(--f-mono); letter-spacing:.08em; border:0; background:none; color:var(--muted); padding:8px 10px; border-radius:999px; cursor:pointer; min-width:40px}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.langs button:hover:not([aria-pressed="true"]){color:var(--ink)}
.burger{display:none; width:44px; height:44px; border:1px solid var(--line); background:none; border-radius:var(--r-sm); color:var(--ink); cursor:pointer; place-items:center}
.burger svg{width:20px; height:20px}
.mnav{display:none}

@media (max-width: 920px){
  .nav{display:none}
  .langs{margin-left:auto}
  .burger{display:grid}
  .mnav{display:block; position:fixed; inset:calc(64px + env(safe-area-inset-top,0px)) 0 auto 0; background:var(--paper); border-bottom:1px solid var(--line); z-index:49; padding:var(--s3) var(--gutter) var(--s5)}
  .mnav[hidden]{display:none!important}
  .mnav a{display:flex; justify-content:space-between; align-items:center; text-decoration:none; font-family:var(--f-display); font-size:1.35rem; padding:14px 2px; border-bottom:1px solid var(--line); min-height:52px}
  .mnav a span{font-family:var(--f-mono); font-size:.72rem; color:var(--muted)}
  .mnav a[aria-current="true"]{color:var(--accent)}
}
@media (max-width: 420px){ .mark span{display:none} .langs button{min-width:38px; padding:8px 8px} }

/* ---------- Hero ---------- */
.hero{padding-block:clamp(40px,7vw,88px) clamp(40px,6vw,72px)}
.hero-grid{display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:clamp(32px,5vw,72px); align-items:start}
.metaline{display:flex; flex-wrap:wrap; gap:6px 18px; color:var(--muted); margin-bottom:var(--s5)}
.metaline span{display:inline-flex; align-items:center; gap:8px}
.metaline span::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent)}
.name{font-size:clamp(2.9rem,8.4vw,6.4rem); font-weight:600; letter-spacing:-.025em; line-height:.98}
.name .l2{display:block; font-style:italic; font-weight:500; color:var(--accent)}
.headline{margin-top:var(--s5); font-family:var(--f-display); font-size:clamp(1.15rem,2.1vw,1.5rem); font-weight:400; line-height:1.35; max-width:34ch; color:var(--ink)}
.lead{margin-top:var(--s4); color:var(--muted); max-width:62ch; font-size:1.02rem}
.focus{display:flex; flex-wrap:wrap; gap:8px; margin-top:var(--s5)}
.focus li{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; font-size:.88rem}
.ctas{display:flex; flex-wrap:wrap; gap:12px; margin-top:var(--s6)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:48px; padding:0 22px; border-radius:999px; font:500 .95rem/1 var(--f-body); text-decoration:none; border:1px solid var(--ink); transition:transform .15s, background .15s, color .15s; cursor:pointer}
.btn-primary{background:var(--ink); color:var(--paper)}
.btn-primary:hover{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn-ghost{background:transparent; color:var(--ink)}
.btn-ghost:hover{background:var(--surface)}
.btn svg{width:16px; height:16px}
.btn-band{background:var(--band-accent); border-color:var(--band-accent); color:var(--band)}
.btn-band:hover{background:transparent; color:var(--band-accent)}
.cv-dl[aria-busy="true"]{opacity:.6; pointer-events:none}

.portrait{margin:0; position:relative}
.portrait .frame{position:relative; border-radius:var(--r); overflow:hidden; background:var(--surface); border:1px solid var(--line); aspect-ratio:560/700; max-width:100%}
.portrait .frame{background:#F2F3F3}
.portrait img{position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:cover; object-position:50% 30%}
.portrait figcaption{display:grid; gap:2px; padding-top:var(--s3); border-top:1px solid var(--line); margin-top:var(--s3)}
.portrait figcaption .mono{color:var(--muted)}
.portrait figcaption strong{font-weight:500; font-size:.92rem; line-height:1.35}
.corner{position:absolute; width:18px; height:18px; border-color:var(--accent); border-style:solid; z-index:2}
.corner.tl{top:-7px; left:-7px; border-width:2px 0 0 2px}
.corner.br{bottom:calc(-7px); right:-7px; border-width:0 2px 2px 0}

.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:clamp(40px,6vw,64px); border-top:1px solid var(--ink); border-bottom:1px solid var(--line)}
.stat{padding:var(--s5) var(--s5) var(--s5) 0; display:flex; align-items:baseline; gap:14px; min-width:0}
.stat + .stat{padding-left:var(--s5); border-left:1px solid var(--line)}
.stat b{font-family:var(--f-display); font-size:clamp(2.4rem,5vw,3.6rem); font-weight:600; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums}
.stat span{font-size:.92rem; color:var(--muted); line-height:1.3; min-width:0}

@media (max-width: 860px){
  .hero-grid{grid-template-columns:1fr}
  .portrait{display:grid; grid-template-columns:112px 1fr; gap:var(--s4); align-items:end; order:-1}
  .portrait figcaption{border-top:0; margin-top:0; padding-top:0}
  .corner{display:none}
}
@media (max-width: 560px){
  .stats{grid-template-columns:1fr}
  .stat, .stat + .stat{padding:var(--s4) 0; border-left:0}
  .stat + .stat{border-top:1px solid var(--line)}
  .ctas .btn{flex:1 1 auto}
}

/* ---------- Sections ---------- */
section.block{padding-block:clamp(56px,8vw,104px); border-top:1px solid var(--line)}
.sec-head{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:var(--s5) var(--s7); align-items:end; margin-bottom:clamp(28px,4vw,48px)}
.sec-head h2{font-size:clamp(1.9rem,4vw,2.9rem); letter-spacing:-.015em; margin-top:var(--s3)}
.sec-head p{color:var(--muted); max-width:52ch}
@media (max-width: 760px){ .sec-head{grid-template-columns:1fr} }

/* Expertise */
.xgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s4)}
.xcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:var(--s5); display:flex; flex-direction:column; gap:var(--s3); transition:border-color .2s, transform .2s; min-width:0}
.xcard:hover{border-color:var(--accent); transform:translateY(-2px)}
.xcard .ico{width:40px; height:40px; border-radius:8px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center}
.xcard .ico svg{width:20px; height:20px}
.xcard h3{font-size:1.25rem}
.xcard p{color:var(--muted); font-size:.95rem}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tags li{font-size:.8rem; padding:4px 10px; border-radius:var(--r-sm); background:var(--paper); border:1px solid var(--line)}
.ev{margin-top:auto; padding-top:var(--s3); border-top:1px dashed var(--line); color:var(--muted); font-family:var(--f-mono); font-size:.74rem; line-height:1.5}
.ev::before{content:"↳ "; color:var(--accent)}
@media (max-width: 980px){ .xgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width: 620px){ .xgrid{grid-template-columns:1fr} }

/* Career span */
.span{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:var(--s5); margin-bottom:var(--s7)}
.span-top{display:flex; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s4)}
.span-top .mono{color:var(--muted)}
.span-rows{display:grid; gap:10px}
.srow{display:grid; grid-template-columns:170px minmax(0,1fr); gap:var(--s4); align-items:center; text-decoration:none; border-radius:var(--r-sm)}
.srow .lbl{font-size:.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.track{position:relative; height:22px; background:repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px calc(100% / 12)); border-radius:3px}
.bar{position:absolute; top:3px; bottom:3px; background:var(--accent); border-radius:3px; transition:filter .15s}
.bar.alt{background:color-mix(in srgb, var(--accent) 55%, var(--surface))}
.srow:hover .bar{filter:brightness(1.12)}
.axis{display:grid; grid-template-columns:170px minmax(0,1fr); gap:var(--s4); margin-top:8px}
.ticks{display:grid; grid-template-columns:repeat(12,1fr); color:var(--muted); font-family:var(--f-mono); font-size:.7rem}
.legend{display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:.8rem}
.legend i{display:inline-block; width:14px; height:8px; border-radius:2px; background:var(--accent); margin-right:6px; vertical-align:middle}
.legend i.alt{background:color-mix(in srgb, var(--accent) 55%, var(--surface))}
@media (max-width: 640px){
  .srow, .axis{grid-template-columns:1fr; gap:4px}
  .axis > :first-child{display:none}
  .ticks span:nth-child(even){visibility:hidden}
  .span{padding:var(--s4)}
}

/* Timeline */
.tl{position:relative; display:grid; gap:var(--s4)}
.job{display:grid; grid-template-columns:150px minmax(0,1fr); gap:var(--s5)}
.job .when{padding-top:22px; text-align:right; color:var(--muted)}
.job .when b{display:block; font-family:var(--f-mono); font-weight:500; font-size:.8rem; color:var(--ink); letter-spacing:.02em}
.job .when span{font-family:var(--f-mono); font-size:.72rem}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); transition:border-color .2s; min-width:0}
.card:hover, .card[open]{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.card > summary{list-style:none; cursor:pointer; padding:var(--s5); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--s4); align-items:start}
.card > summary::-webkit-details-marker{display:none}
.card .org{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); line-height:1.5}
.card h3{font-size:1.3rem; margin-top:6px}
.card .sum{color:var(--muted); margin-top:8px; font-size:.95rem}
.card .roles{display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--s3)}
.card .roles li{font-size:.78rem; padding:3px 9px; border-radius:999px; background:var(--accent-soft); color:var(--ink)}
.chev{display:inline-flex; align-items:center; gap:8px; font-family:var(--f-mono); font-size:.72rem; color:var(--muted); white-space:nowrap; padding:8px 0}
.chev svg{width:16px; height:16px; transition:transform .2s}
.card[open] .chev svg{transform:rotate(180deg)}
.chev .c{display:none}
.card[open] .chev .o{display:none}
.card[open] .chev .c{display:inline}
.detail{padding:0 var(--s5) var(--s5); display:grid; gap:var(--s4)}
.role{border-top:1px solid var(--line); padding-top:var(--s4); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px var(--s4)}
.role h4{margin:0; font-size:1rem; font-weight:600}
.role .rp{font-family:var(--f-mono); font-size:.74rem; color:var(--muted); text-align:right; white-space:nowrap}
.role ul{grid-column:1 / -1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px var(--s5); margin-top:6px}
@media (max-width: 900px){ .role ul{grid-template-columns:1fr} }
.role li{position:relative; padding-left:18px; font-size:.95rem; color:var(--ink)}
.role li::before{content:""; position:absolute; left:2px; top:.72em; width:7px; height:1.5px; background:var(--accent)}
.gap{display:grid; grid-template-columns:150px minmax(0,1fr); gap:var(--s5)}
@media (max-width: 720px){
  .job{grid-template-columns:1fr; gap:6px}
  .job .when{padding-top:0; text-align:left; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
  .card > summary{padding:var(--s4); grid-template-columns:1fr}
  .chev{justify-self:start; padding:4px 0 0}
  .detail{padding:0 var(--s4) var(--s4)}
  .role{grid-template-columns:1fr}
  .role .rp{text-align:left; white-space:normal}
}

/* Projects */
.pgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s4)}
.proj .sl{display:flex; gap:4px; flex-wrap:wrap}
.proj .sl span:not(.sr){font-family:var(--f-mono); font-size:.66rem; letter-spacing:.06em; padding:2px 6px; border:1px solid var(--line); border-radius:4px; color:var(--muted)}
.proj{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column; text-decoration:none; color:inherit; transition:border-color .2s, transform .2s; min-width:0}
a.proj:hover{border-color:var(--accent); transform:translateY(-3px)}
.proj .plate{aspect-ratio:16/10; max-width:100%; background:var(--accent-soft); position:relative; border-bottom:1px solid var(--line)}
.proj .plate img{position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:cover; object-position:top}
.proj .plate .mono{position:absolute; left:12px; top:10px; color:var(--ink); font-size:.68rem; background:rgba(255,255,255,.9); padding:3px 9px; border-radius:999px}
.proj .pb{padding:var(--s4) var(--s4) var(--s5); display:flex; flex-direction:column; gap:6px; flex:1}
.proj h3{font-size:1.15rem}
.proj .k{font-size:.86rem; color:var(--muted)}
.proj .url{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); overflow-wrap:anywhere; margin-top:auto; padding-top:var(--s3)}
.proj .go{display:inline-flex; align-items:center; gap:6px; font-size:.86rem; font-weight:500; color:var(--accent)}
.proj .go svg{width:14px; height:14px}
@media (max-width: 980px){ .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width: 480px){ .pgrid{grid-template-columns:1fr} .proj .plate{aspect-ratio:16/7} }

/* Education + languages */
.edu-grid{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:clamp(32px,5vw,64px)}
.edu-grid h3.sub{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500; margin-bottom:var(--s4)}
.edu li{display:grid; grid-template-columns:72px minmax(0,1fr); gap:var(--s4); padding-block:var(--s4); border-top:1px solid var(--line)}
.edu li:last-child{border-bottom:1px solid var(--line)}
.edu .yr{font-family:var(--f-display); font-size:1.5rem; font-weight:600; color:var(--accent); line-height:1.1; font-variant-numeric:tabular-nums}
.edu strong{display:block; font-family:var(--f-display); font-size:1.15rem; font-weight:600; line-height:1.3}
.edu span{color:var(--muted); font-size:.93rem}
.langs-list li{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:4px var(--s4); padding-block:12px; border-top:1px solid var(--line)}
.langs-list li:last-child{border-bottom:1px solid var(--line)}
.langs-list .ln{font-weight:500}
.langs-list .lv{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; grid-column:1}
.meter{display:flex; gap:4px; grid-row:1 / span 2; grid-column:2}
.meter i{width:22px; height:6px; border-radius:2px; background:var(--line)}
.meter i.on{background:var(--accent)}
.extra{margin-top:var(--s6); display:grid; gap:8px}
.extra li{display:flex; gap:10px; align-items:baseline; font-size:.95rem}
.extra li::before{content:""; flex:none; width:6px; height:6px; border-radius:50%; background:var(--accent); transform:translateY(-2px)}
@media (max-width: 820px){ .edu-grid{grid-template-columns:1fr} }

/* Contact band */
.contact{background:var(--band); color:var(--band-fg); padding-block:clamp(64px,9vw,120px)}
.contact .eyebrow{color:var(--band-accent)}
.contact h2{font-size:clamp(2.2rem,6vw,4.4rem); letter-spacing:-.02em; margin-top:var(--s3)}
.contact .clead{color:var(--band-muted); margin-top:var(--s4); max-width:52ch}
.clist{margin-top:clamp(32px,5vw,56px); display:grid; border-top:1px solid var(--band-line)}
.citem{display:grid; grid-template-columns:140px minmax(0,1fr) auto; gap:var(--s4); align-items:center; padding-block:var(--s5); border-bottom:1px solid var(--band-line)}
.citem .ck{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; color:var(--band-muted)}
.citem .cv{font-family:var(--f-display); font-size:clamp(1.3rem,3.2vw,2.1rem); font-weight:500; overflow-wrap:anywhere; text-decoration:none; color:var(--band-fg); user-select:all; -webkit-user-select:all}
.citem a.cv:hover{color:var(--band-accent)}
.citem .cv.small{font-size:clamp(1.1rem,2.4vw,1.5rem); user-select:auto; -webkit-user-select:auto}
.copy{font:500 .8rem/1 var(--f-mono); letter-spacing:.04em; color:var(--band-fg); background:transparent; border:1px solid var(--band-line); border-radius:999px; padding:0 16px; min-height:44px; cursor:pointer; transition:border-color .15s, color .15s; white-space:nowrap}
.copy:hover{border-color:var(--band-accent); color:var(--band-accent)}
.copy.done{border-color:var(--band-accent); color:var(--band-accent)}
.contact :focus-visible{outline-color:var(--band-accent)}
@media (max-width: 640px){
  .citem{grid-template-columns:minmax(0,1fr) auto; gap:6px var(--s3)}
  .citem .ck{grid-column:1 / -1}
}
footer{background:var(--band); color:var(--band-muted); border-top:1px solid var(--band-line); padding-block:var(--s5)}
footer .wrap{display:flex; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; font-family:var(--f-mono); font-size:.74rem}
footer a{color:var(--band-fg)}

/* Motion */
.rv{transition:opacity .6s ease, transform .6s ease}
.rv.pre{opacity:0; transform:translateY(14px)}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.hero .anim{animation:rise .7s ease both}
.hero .anim:nth-child(2){animation-delay:.06s}
.hero .anim:nth-child(3){animation-delay:.12s}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important; transition:none!important}
  .rv.pre{opacity:1; transform:none}
}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>

  $("#mnav").innerHTML = SECTIONS.map((id,i) => `<a href="#${id}" data-sec="${id}">${esc(t.nav[id])}<span>0${i+1}</span></a>`).join("");
}

function renderHero(t){
  $("#about").innerHTML = `
  <div class="hero-grid">
    <div>
      <p class="metaline mono anim">${t.meta.map(m => `<span>${esc(m)}</span>`).join("")}</p>
      <h1 class="name anim" id="h-name">${esc(t.name[0])}<span class="l2">${esc(t.name[1])}</span></h1>
      <div class="anim">
        <p class="headline">${esc(t.headline)}</p>
        <p class="lead">${esc(t.lead)}</p>
        <ul class="focus" aria-label="${esc(t.nav.expertise)}">${t.focus.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
        <div class="ctas">
          <a class="btn btn-primary" href="#experience">${esc(t.cta[0])} ${DOWN}</a>
          <a class="btn btn-ghost" href="#contact">${esc(t.cta[1])}</a>
          <a class="btn btn-ghost cv-dl" href="${cvFile()}" download target="_blank" rel="noopener">${PDFICON} ${esc(t.cv)}</a>
        </div>
      </div>
    </div>
    <figure class="portrait">
      <div class="frame"><span class="corner tl" aria-hidden="true"></span><img src="${PHOTO}" alt="${esc(t.photoAlt)}" width="560" height="700"><span class="corner br" aria-hidden="true"></span></div>
      <figcaption><span class="mono">${esc(t.caption[0])}</span><strong>${esc(t.caption[1])}</strong></figcaption>
    </figure>
  </div>
  <ul class="stats">${t.stats.map(([n,l]) => `<li class="stat"><b>${n}</b><span>${esc(l)}</span></li>`).join("")}</ul>`;
}

function head(id, eyebrow, title, intro){
  return `<div class="sec-head rv"><div><p class="eyebrow">${esc(eyebrow)}</p><h2 id="h-${id}">${esc(title)}</h2></div>${intro ? `<p>${esc(intro)}</p>` : ""}</div>`;
}

function renderExpertise(t){
  $("#expertiseIn").innerHTML = head("expertise", t.xEyebrow, t.xTitle, t.xIntro) +
  `<div class="xgrid">${t.xgroups.map(([h,d,tags,ev],i) => `
    <article class="xcard rv">
      <span class="ico" aria-hidden="true">${ICONS[XICONS[i]]}</span>
      <h3>${esc(h)}</h3>
      <p>${esc(d)}</p>
      ${tags.length ? `<ul class="tags">${tags.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <p class="ev">${esc(ev)}</p>
    </article>`).join("")}</div>`;
}

function jobRange(job){
  const all = job.roles.flatMap(r => r.periods);
  const s = all.map(p => p[0]).sort()[0], e = all.map(p => p[1]).sort().slice(-1)[0];
  return [s,e];
}

function renderExperience(t){
  const years = Array.from({length:12}, (_,i) => 2015 + i);
  const rows = JOBS.map(job => {
    const tj = t.jobs[job.id];
    const segs = job.roles.flatMap(r => r.periods.map((p,pi) => ({p, alt: pi > 0, title: `${tj.roles[r.key][0]}: ${fmt(p[0])} – ${fmt(p[1])}`})));
    const [s,e] = jobRange(job);
    return `<a class="srow" href="#job-${job.id}" data-job="${job.id}" aria-label="${esc(tj.org)}, ${fmt(s)} – ${fmt(e)}">
      <span class="lbl">${esc(tj.short)}</span>
      <span class="track" aria-hidden="true">${segs.map(sg => `<span class="bar${sg.alt ? " alt" : ""}" title="${esc(sg.title)}" style="left:${pct(ym(sg.p[0]))}%;width:calc(${(pct(ym(sg.p[1])+1) - pct(ym(sg.p[0]))).toFixed(3)}% - 2px)"></span>`).join("")}</span>
    </a>`;
  }).join("");

  const cards = JOBS.map(job => {
    const tj = t.jobs[job.id];
    const [s,e] = jobRange(job);
    const total = months(job.roles.flatMap(r => r.periods));
    const multi = job.roles.length > 1;
    const roleHtml = job.roles.map(r => {
      const [title, bullets] = tj.roles[r.key];
      const per = r.periods.map(p => `${fmt(p[0])} – ${fmt(p[1])}`).join(" · ");
      return `<div class="role"><h4>${esc(title)}</h4><span class="rp">${per} · ${dur(months(r.periods), t)}</span><ul>${bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>`;
    }).join("");
    return `<div class="job rv" id="job-${job.id}">
      <p class="when"><b>${fmt(e)}</b><span>${fmt(s)} · ${dur(total, t)}</span></p>
      <details class="card" data-id="${job.id}"${openState.has(job.id) ? " open" : ""}>
        <summary>
          <div>
            <p class="org">${esc(tj.org)}</p>
            <h3>${esc(multi ? tj.title : tj.roles.main[0])}</h3>
            <p class="sum">${esc(tj.sum)}</p>
            ${multi ? `<ul class="roles" aria-label="${esc(t.rolesN(job.roles.length))}">${job.roles.map(r => `<li>${esc(tj.roles[r.key][0])}</li>`).join("")}</ul>` : ""}
          </div>
          <span class="chev"><span class="o">${esc(t.more)}</span><span class="c">${esc(t.less)}</span>${DOWN}</span>
        </summary>
        <div class="detail">${roleHtml}</div>
      </details>
    </div>`;
  }).join("");

  $("#experienceIn").innerHTML = head("experience", t.eEyebrow, t.eTitle, t.eIntro) + `
    <figure class="span rv" style="margin:0 0 var(--s7)">
      <figcaption class="span-top"><span class="mono">${esc(t.spanTitle)}</span>
        <span class="legend"><span><i></i>${esc(t.spanLegend[0])}</span><span><i class="alt"></i>${esc(t.spanLegend[1])}</span></span></figcaption>
      <div class="span-rows">${rows}</div>
      <div class="axis" aria-hidden="true"><span></span><div class="ticks">${years.map(y => `<span>${y}</span>`).join("")}</div></div>
    </figure>
    <div class="tl">${cards}</div>`;

  document.querySelectorAll("#experienceIn details.card").forEach(d => d.addEventListener("toggle", () => {
    d.open ? openState.add(d.dataset.id) : openState.delete(d.dataset.id);
  }));
  document.querySelectorAll(".srow").forEach(a => a.addEventListener("click", () => {
    openState.add(a.dataset.job);
    const d = document.querySelector(`details[data-id="${a.dataset.job}"]`); if (d) d.open = true;
  }));
}

function renderProjects(t){
  $("#projectsIn").innerHTML = head("projects", t.pEyebrow, t.pTitle, t.pIntro) +
  `<div class="pgrid">${PROJECTS.map(p => `
    <a class="proj rv" href="${p.url}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p.name)}: ${esc(t.proj[p.id])}. ${esc(t.open)} ${esc(t.opensNew)}">
      <div class="plate" aria-hidden="true"><img src="${THUMBS[p.id]}" alt="" loading="lazy"><span class="mono">${esc(t.kinds[p.kind])}</span></div>
      <div class="pb">
        <h3>${esc(p.name)}</h3>
        <p class="k">${esc(t.proj[p.id])}</p>
        ${p.site.length ? `<p class="sl"><span class="sr">${esc(t.siteLangs)}: </span>${p.site.map(l => `<span>${l}</span>`).join("")}</p>` : ""}
        <p class="url">${p.domain}</p>
        <span class="go">${esc(t.open)} ${ARROW}</span>
      </div>
    </a>`).join("")}</div>`;
}

function renderEducation(t){
  $("#educationIn").innerHTML = head("education", t.edEyebrow, t.edTitle, t.edIntro) + `
  <div class="edu-grid">
    <div class="rv">
      <h3 class="sub">${esc(t.eduHead)}</h3>
      <ul class="edu">${t.edu.map(([d,u],i) => `<li><span class="yr">${EDU_YEARS[i]}</span><div><strong>${esc(d)}</strong><span>${esc(u)}</span></div></li>`).join("")}</ul>
    </div>
    <div class="rv">
      <h3 class="sub">${esc(t.langHead)}</h3>
      <ul class="langs-list">${t.langs.map(([n,l],i) => `<li><span class="ln">${esc(n)}</span><span class="lv">${esc(l)}</span><span class="meter" role="img" aria-label="${esc(n)}: ${esc(l)}, ${LANG_LEVELS[i]}/5">${[1,2,3,4,5].map(k => `<i class="${k <= LANG_LEVELS[i] ? "on" : ""}"></i>`).join("")}</span></li>`).join("")}</ul>
      <h3 class="sub" style="margin-top:var(--s6)">${esc(t.extraHead)}</h3>
      <ul class="extra" style="margin-top:0">${t.extra.map(x => `<li>${esc(x)}</li>`).join("")}</ul>

function renderContact(t){
  $("#contactIn").innerHTML = `
    <p class="eyebrow">${esc(t.cEyebrow)}</p>
    <h2 id="h-contact">${esc(t.cTitle)}</h2>
    <p class="clead">${esc(t.cLead)}</p>
    <div class="clist">
      <div class="citem"><span class="ck">${esc(t.cLabels[0])}</span><a class="cv" href="mailto:${CONTACT.email}" id="cEmail">${CONTACT.email}</a><button class="copy" type="button" data-copy="${CONTACT.email}" aria-label="${esc(t.copy)}: ${CONTACT.email}">${esc(t.copy)}</button></div>
      <div class="citem"><span class="ck">${esc(t.cLabels[1])}</span><a class="cv" href="tel:${CONTACT.tel}" id="cPhone">${CONTACT.phone}</a><button class="copy" type="button" data-copy="${CONTACT.phone}" aria-label="${esc(t.copy)}: ${CONTACT.phone}">${esc(t.copy)}</button></div>
      <div class="citem"><span class="ck">${esc(t.cLabels[2])}</span><span class="cv small">${esc(t.region)}</span><span></span></div>
    </div>
    <p style="margin-top:var(--s6)"><a class="btn btn-band cv-dl" href="${cvFile()}" download target="_blank" rel="noopener">${PDFICON} ${esc(t.cv)}</a></p>`;
  document.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
    const val = b.dataset.copy;
    const ok = () => { b.textContent = T[lang].copied; b.classList.add("done"); setTimeout(() => { b.textContent = T[lang].copy; b.classList.remove("done"); }, 1800); };
    const fallback = () => { const el = b.previousElementSibling; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(val).then(ok, fallback); } catch(e){ fallback(); }
  }));
  $("#footIn").innerHTML = `<span>© 2026 ${esc(t.foot)}</span><a href="#about">${esc(t.toTop)} ↑</a>`;
}

/* ================= BEHAVIOUR ================= */
function setLang(l){
  lang = T[l] ? l : "ru";
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle.split(" — ")[0];
  $("#skip").textContent = t.skip;
  $("#markName").textContent = t.foot;
  $("#burger").setAttribute("aria-label", t.menu);
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderNav(t); renderHero(t); renderExpertise(t); renderExperience(t); renderProjects(t); renderEducation(t); renderContact(t);
  setupReveal(); markActive();
  try { localStorage.setItem("tb-lang", lang); } catch(e){}
}

document.querySelectorAll("#langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* mobile nav */
const burger = $("#burger"), mnav = $("#mnav");
function toggleMenu(open){
  mnav.hidden = !open;
  burger.setAttribute("aria-expanded", String(open));
  burger.setAttribute("aria-label", open ? T[lang].close : T[lang].menu);
  $("#burgerPath").setAttribute("d", open ? "M6 6l12 12M18 6L6 18" : "M4 7h16M4 12h16M4 17h16");
}
burger.addEventListener("click", () => toggleMenu(mnav.hidden));
mnav.addEventListener("click", e => { if (e.target.closest("a")) toggleMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !mnav.hidden){ toggleMenu(false); burger.focus(); } });
matchMedia("(min-width: 921px)").addEventListener("change", e => { if (e.matches) toggleMenu(false); });

/* header border + active section */
let current = "about";
function markActive(){
  document.querySelectorAll("[data-sec]").forEach(a => a.setAttribute("aria-current", String(a.dataset.sec === current)));
}
function onScroll(){
  $("#top").classList.toggle("scrolled", scrollY > 8);
  const y = scrollY + innerHeight * 0.35;
  let c = "about";
  for (const id of SECTIONS){ const el = document.getElementById(id); if (el && el.offsetTop <= y) c = id; }
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) c = "contact";
  if (c !== current){ current = c; markActive(); }
}
addEventListener("scroll", onScroll, {passive:true});

/* reveal: only elements below the first screen start hidden */
let io;
function setupReveal(){
  if (io) io.disconnect();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const els = document.querySelectorAll(".rv");
  if (reduce || !("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting){ en.target.classList.remove("pre"); io.unobserve(en.target); } }), {rootMargin:"0px 0px -8% 0px"});
  els.forEach(el => { if (el.getBoundingClientRect().top > innerHeight){ el.classList.add("pre"); io.observe(el); } });
}

/* CV download: saves through the viewer when allowed, otherwise opens the PDF */
const CV_FILES = { ru:"tolegen-bauyrzhan-cv-ru.pdf", kz:"tolegen-bauyrzhan-cv-kz.pdf", en:"tolegen-bauyrzhan-cv-en.pdf" };
function cvFile(){ return CV_FILES[lang]; }
let dlApi;
const dlReady = (window.claude && claude.use) ? claude.use("downloads").then(d => (dlApi = d), () => null) : Promise.resolve(null);
document.addEventListener("click", async e => {
  const a = e.target.closest(".cv-dl"); if (!a) return;
  if (!dlApi) return; /* plain link opens the PDF */
  e.preventDefault();
  const label = a.lastChild.textContent;
  a.setAttribute("aria-busy","true"); a.lastChild.textContent = " " + T[lang].cvBusy;
  try {
    const blob = await (await fetch(cvFile())).blob();
    await dlApi.save({ filename: cvFile(), data: blob });
  } catch(err){
    if (!err || err.code !== "declined") window.open(a.href, "_blank", "noopener");
  } finally { a.removeAttribute("aria-busy"); a.lastChild.textContent = label; }
});

/* init */
let saved = "ru";
try { saved = localStorage.getItem("tb-lang") || "ru"; } catch(e){}
setLang(saved);
onScroll();
</script>
